services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecast_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ai_budget_forecasting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://forecast_admin:change_me@db:5432/ai_budget_forecasting}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://localhost:5174}
      ORIGINAL_ACTUALS_PATH: ${ORIGINAL_ACTUALS_PATH:-/app/model_training_engine/dataset/historical_actuals_master.xlsx}
      HISTORICAL_MASTER_DATASET_PATH: ${HISTORICAL_MASTER_DATASET_PATH:-/app/model_training_engine/dataset/historical_actuals_master.xlsx}
      DATASET_STORAGE_DIR: /app/data/dataset_files
      EDITOR_PERMISSIONS_PATH: /app/config/editor_permissions.json
    volumes:
      - ./backend/model_training_engine/dataset:/app/model_training_engine/dataset:ro
      - ./backend/model_training_engine/output:/app/model_training_engine/output
      - ./backend/data/dataset_files:/app/data/dataset_files
      - ./backend/config/editor_permissions.json:/app/config/editor_permissions.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
